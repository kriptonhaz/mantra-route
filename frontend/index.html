<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mantra.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Lexend:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://ap-gateway.mastercard.com/checkout/version/60/checkout.js"
      data-error="errorCallback"
      data-cancel="cancelCallback"
    ></script>
    <title>Mantra Route</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function errorCallback(error) {
        console.log(JSON.stringify(error));
      }
      function cancelCallback() {
        console.log('Payment cancelled');
      }
    </script>
  </body>
</html>
